server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        image/svg+xml svg;
    }
    default_type application/octet-stream;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
